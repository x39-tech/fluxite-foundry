name: IANA Media Types

# The Fluxite Codex standard requires resource class media types to be from the
# official IANA registry. We bundle a snapshot of the media type registry with
# the app for validation. This periodic workflow ensures that that snapshot is
# up-to-date.

on:
  schedule:
    # 06:00 UTC on the first of each month.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SNAPSHOT: src/codex/ianaMediaTypes.json
  BRANCH: chore/iana-media-types

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
      - run: npm ci

      # Sets the 'changed' output based on whether the snapshot has changed.
      - name: Regenerate the snapshot
        id: regenerate
        run: npm run media-types:update -- --report "$RUNNER_TEMP/body.md"

      - name: Check the new snapshot
        if: steps.regenerate.outputs.changed == 'true'
        run: |
          npx prettier --check "$SNAPSHOT"
          npm test -- src/codex/mediaTypes.test.ts

      - name: Open a pull request
        if: steps.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$SNAPSHOT"
          git commit -m "chore: Refresh the IANA media type snapshot"

          git push --force origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: Refresh the IANA media type snapshot" \
              --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/body.md"
          fi
