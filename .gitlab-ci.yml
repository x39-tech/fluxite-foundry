stages:
  - build
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: normal

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  image: node:latest
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/

test:
  stage: build
  script:
    - npm run test

check_state_immutability:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - ./scripts/check-state-immutability.sh

lint:
  stage: build
  script:
    - npm run lint

format:
  stage: build
  script:
    - npm run formatcheck

pages:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  inherit:
    default: false
  image: alpine:latest
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    - mv dist public
  artifacts:
    paths:
      - public
